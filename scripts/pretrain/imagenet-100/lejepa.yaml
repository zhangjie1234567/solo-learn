defaults:
  - _self_
  - augmentations: lejepa.yaml
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

name: "lejepa-imagenet100"
method: "lejepa"
backbone:
  name: "resnet18"
method_kwargs:
  proj_hidden_dim: 2048
  proj_output_dim: 128
  proj_num_layers: 3
  lamb: 0.05
  num_slices: 256
  num_knots: 17
  t_max: 3.0
data:
  dataset: imagenet100
  train_path: "./datasets/imagenet-100/train"
  val_path: "./datasets/imagenet-100/val"
  format: "image_folder"
  num_workers: 4
optimizer:
  name: "adamw"
  batch_size: 128
  lr: 5.0e-4
  classifier_lr: 1.0e-3
  weight_decay: 1.0e-4
  kwargs:
    betas: [0.9, 0.999]
scheduler:
  name: "warmup_cosine"
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
auto_resume:
  enabled: True

max_epochs: 400
devices: [0]
sync_batchnorm: True
accelerator: "gpu"
precision: 16-mixed
